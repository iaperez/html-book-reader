<title>Biblioteca</title>
<style>
  :root {
    --bg: #f4f1ea; --bg-raised: #fbf9f4; --fg: #2b2822; --fg-soft: #6b6558;
    --accent: #9a5b34; --line: rgba(0,0,0,.1); --shadow: rgba(30,25,15,.15);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --bg-raised: #1d2027; --fg: #d7d4cc; --fg-soft: #8b8a84;
      --accent: #d9915f; --line: rgba(255,255,255,.1); --shadow: rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
    padding: max(2rem, env(safe-area-inset-top)) 1.1rem 4rem;
  }
  .wrap { max-width: 52rem; margin: 0 auto; }
  header { margin: 1rem 0 2.4rem; }
  h1 { font-family: Georgia, serif; font-size: clamp(1.9rem, 6vw, 2.6rem); margin: 0; }
  .tagline { color: var(--fg-soft); margin-top: .4rem; }
  .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); }
  .card {
    display: flex; gap: 1rem; text-decoration: none; color: inherit;
    background: var(--bg-raised); border: 1px solid var(--line);
    border-radius: .9rem; padding: 1rem; transition: transform .12s, box-shadow .12s, border-color .12s;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px var(--shadow); border-color: var(--accent); }
  .cover {
    flex: none; width: 3.6rem; height: 5.2rem; border-radius: .4rem;
    display: grid; place-items: center; font-size: 1.9rem;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), 0 4px 12px var(--shadow);
  }
  .meta { min-width: 0; }
  .meta h2 { font-family: Georgia, serif; font-size: 1.12rem; margin: .1rem 0 .2rem; }
  .meta .author { font-size: .85rem; color: var(--fg-soft); }
  .meta .desc { font-size: .82rem; color: var(--fg-soft); margin-top: .5rem;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .meta .stats { font-size: .72rem; color: var(--fg-soft); margin-top: .55rem; letter-spacing: .02em; }
  footer { margin-top: 3rem; color: var(--fg-soft); font-size: .8rem; }
  footer a { color: var(--accent); }
</style>

<div class="wrap">

  <div class="grid" id="grid"></div>

    Textos de dominio público.
  </footer>
</div>

<script>

    "</div></a>";
