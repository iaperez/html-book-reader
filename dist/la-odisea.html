<!--
  Standalone book reader — generated by publish.js
  Everything (styles, script, and the full book) is inlined into this single
  file, so it works offline, on a phone, or hosted anywhere static.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>La Odisea</title>
<style>
  :root {
    --font-scale: 1;
    --measure: 34rem;
    /* light (default) */
    --bg: #f4f1ea;
    --bg-raised: #fbf9f4;
    --fg: #2b2822;
    --fg-soft: #6b6558;
    --accent: #9a5b34;
    --line: rgba(0, 0, 0, .1);
    --shadow: rgba(30, 25, 15, .18);
  }
  :root[data-theme="sepia"] {
    --bg: #ece0c8; --bg-raised: #f4ead4; --fg: #453a28; --fg-soft: #7c6b4d;
    --accent: #9a5b34; --line: rgba(90, 70, 40, .18); --shadow: rgba(60, 45, 20, .22);
  }
  :root[data-theme="dark"] {
    --bg: #14161a; --bg-raised: #1d2027; --fg: #d7d4cc; --fg-soft: #8b8a84;
    --accent: #d9915f; --line: rgba(255, 255, 255, .1); --shadow: rgba(0, 0, 0, .5);
  }
  /* follow system when no explicit choice was made */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      --bg: #14161a; --bg-raised: #1d2027; --fg: #d7d4cc; --fg-soft: #8b8a84;
      --accent: #d9915f; --line: rgba(255, 255, 255, .1); --shadow: rgba(0, 0, 0, .5);
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--reader-font, Georgia, "Iowan Old Style", "Times New Roman", serif);
    line-height: 1.7;
    transition: background .25s ease, color .25s ease;
  }
  body[data-sans] { --reader-font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

  /* ---- top bar ---- */
  .bar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: .25rem;
    padding: max(.4rem, env(safe-area-inset-top)) .5rem .4rem;
    padding-left: max(.5rem, env(safe-area-inset-left));
    padding-right: max(.5rem, env(safe-area-inset-right));
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    -webkit-backdrop-filter: saturate(1.4) blur(10px);
    backdrop-filter: saturate(1.4) blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .bar__title {
    flex: 1; min-width: 0;
    font-size: .82rem; font-weight: 600; letter-spacing: .01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-align: center; color: var(--fg-soft);
    font-family: system-ui, sans-serif;
  }
  .iconbtn {
    flex: none;
    width: 2.4rem; height: 2.4rem;
    display: grid; place-items: center;
    border: 0; border-radius: 50%;
    background: transparent; color: var(--fg);
    cursor: pointer; font-size: 1.15rem; line-height: 1;
    -webkit-tap-highlight-color: transparent;
  }
  .iconbtn:hover { background: color-mix(in srgb, var(--fg) 8%, transparent); }
  .iconbtn:active { transform: scale(.92); }
  .iconbtn svg { width: 1.35rem; height: 1.35rem; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* overall progress bar */
  .progress { height: 2px; background: transparent; }
  .progress__fill { height: 100%; width: 0; background: var(--accent); transition: width .15s ease; }

  /* ---- reading area ---- */
  main {
    max-width: var(--measure);
    margin: 0 auto;
    padding: 2.4rem clamp(1.1rem, 5vw, 2rem) 5rem;
    font-size: calc(1.12rem * var(--font-scale));
  }
  .chapter__kicker {
    font-family: system-ui, sans-serif;
    font-size: .72rem; letter-spacing: .18em; text-transform: uppercase;
    color: var(--accent); margin: 0 0 .6rem;
  }
  .chapter__title {
    font-size: calc(1.7rem * var(--font-scale));
    line-height: 1.2; margin: 0 0 1.8rem; font-weight: 700;
  }
  main p { margin: 0 0 1.15em; text-align: justify; hyphens: auto; }
  main p.verse { text-align: left; white-space: pre-wrap; font-style: normal; }
  main h2, main h3 { line-height: 1.3; margin: 2em 0 .8em; }
  main hr { border: 0; text-align: center; margin: 2em 0; }
  main hr::before { content: "* * *"; color: var(--fg-soft); letter-spacing: .5em; }

  .chapter-nav {
    display: flex; gap: .7rem; margin-top: 3rem;
    padding-top: 1.5rem; border-top: 1px solid var(--line);
  }
  .chapter-nav button {
    flex: 1; padding: .85rem 1rem; min-height: 44px;
    border: 1px solid var(--line); border-radius: .7rem;
    background: var(--bg-raised); color: var(--fg);
    font: inherit; font-size: .9rem; cursor: pointer;
    display: flex; flex-direction: column; gap: .15rem;
    transition: border-color .15s;
  }
  .chapter-nav button:hover:not(:disabled) { border-color: var(--accent); }
  .chapter-nav button:disabled { opacity: .35; cursor: default; }
  .chapter-nav button span { font-size: .68rem; color: var(--fg-soft); text-transform: uppercase; letter-spacing: .08em; }
  .chapter-nav .next { text-align: right; align-items: flex-end; }

  /* ---- drawer + sheet shared ---- */
  .scrim {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(0, 0, 0, .45);
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 50;
    width: min(86vw, 22rem);
    background: var(--bg-raised);
    border-right: 1px solid var(--line);
    box-shadow: 0 0 40px var(--shadow);
    transform: translateX(-102%); transition: transform .28s cubic-bezier(.4,.0,.2,1);
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top);
  }
  .drawer.open { transform: translateX(0); }
  .drawer__head { padding: 1.2rem 1.25rem .8rem; border-bottom: 1px solid var(--line); }
  .drawer__book { font-size: 1.05rem; font-weight: 700; }
  .drawer__author { font-size: .82rem; color: var(--fg-soft); margin-top: .15rem; }
  .toc { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: .5rem 0 1.5rem; }
  .toc a {
    display: flex; gap: .7rem; align-items: baseline;
    padding: .72rem 1.25rem; color: var(--fg); text-decoration: none;
    font-size: .92rem; border-left: 3px solid transparent;
  }
  .toc a .n { color: var(--fg-soft); font-size: .78rem; font-variant-numeric: tabular-nums; min-width: 1.5rem; }
  .toc a:hover { background: color-mix(in srgb, var(--fg) 6%, transparent); }
  .toc a.current { border-left-color: var(--accent); color: var(--accent); font-weight: 600; background: color-mix(in srgb, var(--accent) 8%, transparent); }

  /* ---- settings sheet (bottom) ---- */
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: var(--bg-raised);
    border-top: 1px solid var(--line);
    border-radius: 1.1rem 1.1rem 0 0;
    box-shadow: 0 -10px 40px var(--shadow);
    transform: translateY(102%); transition: transform .28s cubic-bezier(.4,0,.2,1);
    padding: 1rem 1.25rem calc(1.5rem + env(safe-area-inset-bottom));
  }
  .sheet.open { transform: translateY(0); }
  .sheet__grip { width: 2.4rem; height: .28rem; border-radius: 1rem; background: var(--line); margin: 0 auto 1rem; }
  .field { margin: 1.1rem 0; }
  .field__label { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--fg-soft); margin-bottom: .5rem; }
  .seg { display: flex; gap: .4rem; }
  .seg button {
    flex: 1; min-height: 44px; padding: .5rem;
    border: 1px solid var(--line); border-radius: .6rem;
    background: var(--bg); color: var(--fg);
    font: inherit; font-size: .85rem; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-weight: 600; }
  .swatch { font-size: 1.1rem; }

  .home-link { display:inline-block; margin-top: 2.5rem; font-size:.82rem; color: var(--fg-soft); text-decoration: none; font-family: system-ui, sans-serif;}
  .home-link:hover { color: var(--accent); }

  @media (min-width: 800px) { main { padding-top: 3.5rem; } }
</style>

<div class="bar">
  <button class="iconbtn" id="btn-toc" aria-label="Índice / Contents">
    <svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
  </button>
  <div class="bar__title" id="bar-title">La Odisea</div>

    <svg viewBox="0 0 24 24"><path d="M4 7h11"/><path d="M4 17h6"/><circle cx="18" cy="7" r="2.4"/><circle cx="13" cy="17" r="2.4"/></svg>
  </button>
</div>

    <div class="drawer__book" id="drawer-book"></div>

      <button data-font="serif">Serif</button>

    </div>
  </div>
</div>

<script>
const BOOK = {"slug":"la-odisea","title":"La Odisea","author":"Homero","translator":"según Luis Segalá y Estalella","language":"es","year":"s. VIII a. C.","description":"El regreso de Odiseo a Ítaca tras la guerra de Troya. Edición de muestra con fragmentos de dominio público; reemplaza source.txt con el texto completo (Project Gutenberg #58221) y vuelve a ejecutar node publish.js.","cover":"🏛️","coverBg":"linear-gradient(160deg,#1f6f8b,#0b3d4d)","chapters":[{"title":"Sobre esta edición","html":"<p>Esta es una edición de MUESTRA. Contiene únicamente fragmentos de apertura de algunos cantos de La Odisea, todos de dominio público, incluidos para demostrar el lector. Para publicar la obra completa, sustituye este archivo por el texto íntegro —por ejemplo, el de Project Gutenberg n.º 58221 (traducción de Luis Segalá y Estalella)— y vuelve a ejecutar «node publish.js». El publicador detecta automáticamente los encabezados «CANTO …» y separa los capítulos.</p>"},{"title":"CANTO I","html":"<p>Háblame, Musa, de aquel varón de multiforme ingenio que, después de destruir la sagrada ciudad de Troya, anduvo peregrinando larguísimo tiempo, vio las ciudades y conoció las costumbres de muchos hombres y padeció en su ánimo gran número de trabajos en su navegación por el ponto, en cuanto procuraba salvar su vida y la vuelta de sus compañeros a la patria.</p>\n<p>Mas ni aun así pudo librarlos, como deseaba, y todos perecieron por sus propias locuras. ¡Insensatos! Devoraron las vacas de Helios, hijo de Hiperión, el cual no les permitió que llegara el día del regreso. ¡Oh diosa, hija de Zeus!, cuéntanos aunque no sea más que una parte de tales cosas.</p>\n<p>Ya en aquel entonces los que habían podido escapar de una muerte horrorosa estaban en sus hogares, salvos de los peligros de la guerra y del mar; y solamente Odiseo, que tan gran necesidad sentía de volver a su patria y de ver a su esposa, hallábase retenido en hueca gruta por Calipso, la ninfa veneranda, la divina entre las deidades, que anhelaba tomarlo por marido.</p>"},{"title":"CANTO V","html":"<p>Levantábase la Aurora del lecho, dejando al ilustre Titono, para llevar la luz a los inmortales y a los mortales, cuando los dioses se sentaron a deliberar. Con ellos hallábase Zeus, que truena en las alturas y a todos aventaja en poder. Atenea les recordaba las muchas fatigas de Odiseo, porque le tenía compasión de que permaneciese en la morada de la ninfa.</p>\n<p>Y Zeus, que amontona las nubes, le respondió: «¡Hija!, ¿qué palabras se te escaparon del cerco de los dientes? ¿Acaso no dispusiste tú misma que Odiseo volviera y se vengara de aquellos hombres? Guía con prudencia a Telémaco, ya que puedes hacerlo, para que llegue incólume a su patria y los pretendientes se vuelvan en su nave sin haber logrado nada.»</p>"},{"title":"CANTO IX","html":"<p>Respondióle el ingenioso Odiseo: «¡Rey Alcínoo, el más esclarecido de todos los ciudadanos! En verdad es cosa bella escuchar a un aedo como éste, cuya voz se asemeja a la de una deidad. No creo que haya cosa tan agradable como ver a un pueblo entero poseído por la alegría.</p>\n<p>»Pero tu ánimo se inclinó a preguntarme por mis luctuosos trabajos, para que llore y me lamente todavía más. ¿Qué narraré primero, qué después, siendo tantos los infortunios que me enviaron los dioses? Mas ea, os diré mi nombre, para que lo sepáis: soy Odiseo Laertíada, tan conocido de los hombres por mis astucias, que mi gloria llega hasta el cielo.»</p>"},{"title":"CANTO XII","html":"<p>Tan pronto como la nave dejó la corriente del río Océano y llegó al oleaje del mar de vastos caminos y a la isla Eea —donde están la mansión y las danzas de la Aurora, hija de la mañana, y el orto de Helios—, la varamos en la arena, saltamos a la playa y allí nos dormimos, aguardando a la divinal Aurora.</p>\n<p>Después, cuando mostró sus dedos de rosa la Aurora, hija de la mañana, mandé a algunos compañeros a la morada de Circe para que trajesen el cadáver del difunto Elpénor. Y la maga nos advirtió de los peligros: primero llegaríamos a las Sirenas, que encantan a cuantos hombres se les acercan.</p>"},{"title":"CANTO XXII","html":"<p>Entonces el sagaz Odiseo se despojó de sus andrajos, saltó al gran umbral con el arco y el carcaj lleno de flechas, y lo vertió a sus pies, diciendo a los pretendientes: «Ya terminó este certamen infalible. Ahora veré si acierto en otro blanco que ningún hombre haya tocado todavía, y si Apolo me concede tal gloria.»</p>\n<p>Dijo, y dirigió una amarga flecha contra Antínoo. Iba éste a levantar una bella copa de oro, de dos asas, y ya la tenía en las manos para beber el vino, sin que el pensamiento de la muerte le turbara. La saeta se le clavó en la garganta, y cayó de espaldas, mientras la copa se le escapaba de la mano.</p>"},{"title":"CANTO XXIII","html":"<p>Subió la anciana al piso superior, muy alegre, para anunciar a la señora que su esposo estaba dentro; y las rodillas le brincaban de gozo. Se detuvo junto a la cabeza de Penélope y le dijo: «Despierta, Penélope, hija querida, para que veas con tus propios ojos lo que anhelabas todos los días. Odiseo está en casa; ha llegado, aunque tarde, y ha dado muerte a los ilustres pretendientes.»</p>\n<p>Mas la discreta Penélope, incrédula todavía, bajó de la estancia con el corazón dividido entre hablar de lejos a su esposo o acercarse a besarle la cabeza y tomarle las manos. Largo rato permaneció sentada frente a él, muda de asombro.</p>"}]};

(function () {
  "use strict";
  var KEY = "reader:" + BOOK.slug;
  var $ = function (id) { return document.getElementById(id); };

  var state = load();
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  /* ---------- preferences ---------- */
  function applyPrefs() {
    if (state.theme) document.documentElement.setAttribute("data-theme", state.theme);
    else document.documentElement.removeAttribute("data-theme");
    var scale = state.fontScale || 1;
    document.documentElement.style.setProperty("--font-scale", scale);
    if (state.font === "sans") document.body.setAttribute("data-sans", "");
    else document.body.removeAttribute("data-sans");
    reflectControls();
  }
  function reflectControls() {
    var t = state.theme ||
      (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.querySelectorAll("#seg-theme button").forEach(function (b) {
      b.setAttribute("aria-pressed", b.dataset.theme === t);
    });
    document.querySelectorAll("#seg-font button").forEach(function (b) {
      b.setAttribute("aria-pressed", b.dataset.font === (state.font || "serif"));
    });
  }

  /* ---------- chapter rendering ---------- */
  var current = clampIndex(state.chapter || 0);
  function clampIndex(i) { return Math.max(0, Math.min(BOOK.chapters.length - 1, i | 0)); }

  function renderChapter(i, opts) {
    opts = opts || {};
    current = clampIndex(i);
    var ch = BOOK.chapters[current];
    var main = $("content");
    main.innerHTML =
      '<p class="chapter__kicker">' + esc(BOOK.title) + " · " +
        (current + 1) + " / " + BOOK.chapters.length + "</p>" +
      '<h1 class="chapter__title">' + esc(ch.title) + "</h1>" +
      ch.html +
      navHTML() +
      '<a class="home-link" href="index.html">← Biblioteca</a>';

    $("bar-title").textContent = ch.title;
    wireNav();
    markCurrentInToc();
    state.chapter = current;
    save();

    if (opts.restoreScroll && state.scroll) {
      window.scrollTo(0, state.scroll);
    } else {
      window.scrollTo(0, 0);
    }
    updateProgress();
  }

  function navHTML() {
    var prev = BOOK.chapters[current - 1];
    var next = BOOK.chapters[current + 1];
    return '<div class="chapter-nav">' +
      '<button class="prev" ' + (prev ? "" : "disabled") + '>' +
        "<span>← Anterior</span>" + (prev ? esc(prev.title) : "—") + "</button>" +
      '<button class="next" ' + (next ? "" : "disabled") + '>' +
        "<span>Siguiente →</span>" + (next ? esc(next.title) : "Fin") + "</button>" +
      "</div>";
  }
  function wireNav() {
    var p = document.querySelector(".chapter-nav .prev");
    var n = document.querySelector(".chapter-nav .next");
    if (p && !p.disabled) p.onclick = function () { renderChapter(current - 1); };
    if (n && !n.disabled) n.onclick = function () { renderChapter(current + 1); };
  }

  /* ---------- table of contents ---------- */
  function buildToc() {
    $("drawer-book").textContent = BOOK.title;
    $("drawer-author").textContent = [BOOK.author, BOOK.translator ? "trad. " + BOOK.translator : ""]
      .filter(Boolean).join(" · ");
    var html = BOOK.chapters.map(function (ch, i) {
      return '<a href="#" data-i="' + i + '"><span class="n">' + (i + 1) +
        "</span><span>" + esc(ch.title) + "</span></a>";
    }).join("");
    var toc = $("toc");
    toc.innerHTML = html;
    toc.querySelectorAll("a").forEach(function (a) {
      a.onclick = function (e) { e.preventDefault(); renderChapter(+a.dataset.i); closeAll(); };
    });
  }
  function markCurrentInToc() {
    $("toc").querySelectorAll("a").forEach(function (a) {
      a.classList.toggle("current", +a.dataset.i === current);
    });
  }

  /* ---------- progress ---------- */
  function updateProgress() {
    var docH = document.documentElement.scrollHeight - window.innerHeight;
    var within = docH > 0 ? window.scrollY / docH : 0;
    var frac = (current + Math.min(1, Math.max(0, within))) / BOOK.chapters.length;
    $("progress").style.width = (frac * 100).toFixed(1) + "%";
  }
  var scrollTick;
  window.addEventListener("scroll", function () {
    updateProgress();
    if (scrollTick) return;
    scrollTick = setTimeout(function () {
      scrollTick = null;
      state.scroll = window.scrollY;
      save();
    }, 400);
  }, { passive: true });

  /* ---------- overlays ---------- */
  function openDrawer() { $("drawer").classList.add("open"); $("scrim").classList.add("open"); }
  function openSheet() { $("sheet").classList.add("open"); $("scrim").classList.add("open"); }
  function closeAll() {
    $("drawer").classList.remove("open");
    $("sheet").classList.remove("open");
    $("scrim").classList.remove("open");
  }
  $("btn-toc").onclick = openDrawer;
  $("btn-settings").onclick = openSheet;
  $("scrim").onclick = closeAll;

  /* ---------- settings controls ---------- */
  $("seg-theme").onclick = function (e) {
    var b = e.target.closest("button"); if (!b) return;
    state.theme = b.dataset.theme; save(); applyPrefs();
  };
  $("seg-font").onclick = function (e) {
    var b = e.target.closest("button"); if (!b) return;
    state.font = b.dataset.font; save(); applyPrefs();
  };
  $("seg-size").onclick = function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.dataset.size === "reset") state.fontScale = 1;
    else state.fontScale = Math.min(1.7, Math.max(0.8,
      (state.fontScale || 1) + (+b.dataset.size) * 0.1));
    save(); applyPrefs();
  };

  /* ---------- keyboard (desktop) ---------- */
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") { renderChapter(current + 1); }
    else if (e.key === "ArrowLeft") { renderChapter(current - 1); }
    else if (e.key === "Escape") { closeAll(); }
  });

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  /* ---------- boot ---------- */
  applyPrefs();
  buildToc();
  renderChapter(current, { restoreScroll: true });
})();
</script>
